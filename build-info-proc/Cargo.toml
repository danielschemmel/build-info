[package]
authors = ["Daniel Schemmel <daniel@schemmel.net>"]
description = "Part of the build-info crate: This crate provides the proc-macros."
name = "build-info-proc"
readme = "../README.md"
version = "0.0.47"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
ciborium = "0.2.2"
manyhow = "0.14.1"
num-bigint = "0.5.1"
num-traits = "0.2.19"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full"] }
z85 = "3.0.6"
zstd = "0.14.3"

build-info-common = { version = "=0.0.47", path = "../build-info-common", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
default = []

oxford-comma = []
runtime = []
